<div class="recovery-shell">
  <section class="recovery-card">
    <a routerLink="/admin/login" class="recovery-brand"
      ><span><i class="fas fa-heart-pulse"></i></span>{{ 'CarePoint' | ui }}</a
    ><span class="cp-eyebrow">{{ 'ACCOUNT ACCESS' | ui }}</span>
    <h1>{{ title | ui }}</h1>
    <p>{{ "We'll help you get back to your clinic workspace." | ui }}</p>
    <div class="cp-alert error" *ngIf="error" role="alert">{{ error | ui }}</div>
    <div class="cp-alert success" *ngIf="success" role="status">{{ success | ui }}</div>
    <form #form="ngForm" (ngSubmit)="form.valid && submit()" *ngIf="!success">
      <label *ngIf="mode !== 'confirm-email'"
        >{{ 'Email address' | ui
        }}<input
          type="email"
          [(ngModel)]="email"
          name="email"
          autocomplete="email"
          required
          placeholder="you@example.com" /></label
      ><label *ngIf="mode === 'reset-password'"
        >{{ 'New password' | ui
        }}<input
          type="password"
          [(ngModel)]="newPassword"
          name="password"
          minlength="6"
          required
          autocomplete="new-password" /></label
      ><label *ngIf="mode === 'reset-password' && !route.snapshot.queryParamMap.get('token')"
        >{{ 'Reset token' | ui }}<textarea [(ngModel)]="token" name="token" required></textarea></label
      ><ng-container *ngIf="mode === 'confirm-email' && !token"
        ><label
          >{{ 'Email address' | ui }}<input type="email" [(ngModel)]="email" name="email" required /></label
        ><button class="cp-button" type="button" (click)="resend()" [disabled]="busy || !email">
          {{ 'Resend confirmation' | ui }}
        </button></ng-container
      ><button class="cp-button" *ngIf="mode !== 'confirm-email' || token" [disabled]="busy || form.invalid">
        {{
          (busy
            ? 'Please wait...'
            : mode === 'confirm-email'
              ? 'Confirm email'
              : mode === 'reset-password'
                ? 'Reset password'
                : 'Send reset instructions'
          ) | ui
        }}
      </button>
    </form>
    <a routerLink="/admin/login" class="back-link"
      ><i class="fas fa-arrow-left"></i> {{ 'Back to sign in' | ui }}</a
    >
  </section>
  <footer>{{ 'CarePoint · Connected care, every day.' | ui }}</footer>
</div>
