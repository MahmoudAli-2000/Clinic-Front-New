<div class="recovery-shell"><section class="recovery-card"><a routerLink="/admin/login" class="recovery-brand"><span><i class="fas fa-heart-pulse"></i></span>CarePoint</a><span class="cp-eyebrow">ACCOUNT ACCESS</span><h1>{{title}}</h1><p>We'll help you get back to your clinic workspace.</p><div class="cp-alert error" *ngIf="error" role="alert">{{error}}</div><div class="cp-alert success" *ngIf="success" role="status">{{success}}</div><form #form="ngForm" (ngSubmit)="form.valid && submit()" *ngIf="!success"><label *ngIf="mode!=='confirm-email'">Email address<input type="email" [(ngModel)]="email" name="email" autocomplete="email" required placeholder="you@example.com"></label><label *ngIf="mode==='reset-password'">New password<input type="password" [(ngModel)]="newPassword" name="password" minlength="6" required autocomplete="new-password"></label><label *ngIf="mode==='reset-password' && !route.snapshot.queryParamMap.get('token')">Reset token<textarea [(ngModel)]="token" name="token" required></textarea></label><ng-container *ngIf="mode==='confirm-email' && !token"><label>Email address<input type="email" [(ngModel)]="email" name="email" required></label><button class="cp-button" type="button" (click)="resend()" [disabled]="busy || !email">Resend confirmation</button></ng-container><button class="cp-button" *ngIf="mode!=='confirm-email' || token" [disabled]="busy || form.invalid">{{busy ? 'Please wait...' : mode==='confirm-email' ? 'Confirm email' : mode==='reset-password' ? 'Reset password' : 'Send reset instructions'}}</button></form><a routerLink="/admin/login" class="back-link"><i class="fas fa-arrow-left"></i> Back to sign in</a></section><footer>CarePoint · Connected care, every day.</footer></div>
