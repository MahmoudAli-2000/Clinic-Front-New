<div class="toast-stack" aria-live="polite" aria-atomic="false">
  <article
    *ngFor="let item of toast.items()"
    class="clinic-toast"
    [class.toast-error]="item.type === 'error'"
    [attr.role]="item.type === 'error' ? 'alert' : 'status'"
  >
    <span class="toast-symbol"
      ><i [class]="item.type === 'error' ? 'fas fa-circle-exclamation' : 'fas fa-check'"></i
    ></span>
    <div>
      <strong>{{ item.title | ui }}</strong>
      <p>{{ item.message | ui }}</p>
    </div>
    <button type="button" (click)="toast.dismiss(item.id)" [attr.aria-label]="'Dismiss message' | ui">
      <i class="fas fa-xmark"></i>
    </button>
    <span class="toast-lifetime"></span>
  </article>
</div>
